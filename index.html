<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://img.youtube.com">
    <link rel="preconnect" href="https://i.ytimg.com">
    <title>Video Linker</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #1e1e1e;
            --text: #ffffff;
            --accent: #ff0000;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container { width: 90%; max-width: 450px; padding: 20px; }
        .hidden { display: none !important; }

        /* Smooth Thumbnail Loading */
        .thumb-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #222; /* Placeholder color */
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease-in-out;
        }

        /* Generator Styles */
        input {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333;
            background: #222; color: white; box-sizing: border-box; margin-bottom: 15px;
        }
        button {
            background-color: var(--accent); color: white; border: none;
            padding: 14px 24px; border-radius: 50px; font-weight: bold; width: 100%;
        }
        
        .result-area { margin-top: 20px; padding: 15px; background: var(--card); border-radius: 8px; }

        /* Viewer Styles */
        .video-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 25px; line-height: 1.4; }
        .watch-btn {
            display: block; text-decoration: none; background: #ffffff; color: #000000;
            padding: 18px 32px; border-radius: 50px; font-weight: 800; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="generator" class="hidden">
            <h2>Link Generator</h2>
            <input type="text" id="ytUrl" placeholder="Paste YouTube URL...">
            <button onclick="generateLink()">Generate Link</button>
            <div id="result" class="result-area hidden">
                <p>Your Link:</p>
                <strong id="newUrl" style="cursor:pointer; color: #3ea6ff;"></strong>
            </div>
        </div>

        <div id="viewer" class="hidden">
            <div class="thumb-wrapper">
                <img id="thumb" src="" alt="Thumbnail" class="thumbnail" style="opacity: 0;">
            </div>
            <div id="title" class="video-title">Loading...</div>
            <div id="btnContainer"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v');

        if (videoId) {
            setupViewer(videoId);
        } else {
            document.getElementById('generator').classList.remove('hidden');
        }

        function generateLink() {
            const input = document.getElementById('ytUrl').value;
            const idMatch = input.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/);
            if (idMatch) {
                const finalUrl = `${window.location.origin}${window.location.pathname}?v=${idMatch[1]}`;
                document.getElementById('result').classList.remove('hidden');
                document.getElementById('newUrl').innerText = finalUrl;
                document.getElementById('newUrl').onclick = () => {
                    navigator.clipboard.writeText(finalUrl);
                    alert("Copied!");
                };
            }
        }

        async function setupViewer(id) {
            document.getElementById('viewer').classList.remove('hidden');
            const thumbImg = document.getElementById('thumb');
            
            // 1. FAST LOAD: Load the "Medium Quality" version immediately (very fast)
            thumbImg.src = `https://img.youtube.com/vi/${id}/mqdefault.jpg`;
            thumbImg.onload = () => { thumbImg.style.opacity = "1"; };

            // 2. BACKGROUND LOAD: Try to upgrade to Max Res without making user wait
            const maxRes = new Image();
            maxRes.src = `https://img.youtube.com/vi/${id}/maxresdefault.jpg`;
            maxRes.onload = () => {
                // If it exists (is wider than 120px), swap it
                if (maxRes.width > 120) thumbImg.src = maxRes.src;
            };

            // 3. TITLE (oEmbed)
            fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('title').innerText = data.title;
                    document.title = data.title;
                })
                .catch(() => { document.getElementById('title').innerText = "Watch Video"; });

            // 4. BUTTON LOGIC (Same as before for deep linking)
            const btnContainer = document.getElementById('btnContainer');
            const btn = document.createElement('a');
            btn.className = 'watch-btn';
            btn.innerText = 'Watch in YouTube App';
            
            const isAndroid = /Android/i.test(navigator.userAgent);
            const isiOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

            if (isAndroid) {
                btn.href = `intent://www.youtube.com/watch?v=${id}#Intent;package=com.google.android.youtube;scheme=https;end`;
            } else if (isiOS) {
                btn.href = `youtube://www.youtube.com/watch?v=${id}`;
                btn.onclick = () => {
                    setTimeout(() => { window.location.href = `https://www.youtube.com/watch?v=${id}`; }, 500);
                };
            } else {
                btn.href = `https://www.youtube.com/watch?v=${id}`;
            }
            btnContainer.appendChild(btn);
        }
    </script>
</body>
</html>
