<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://img.youtube.com">
    <link rel="preconnect" href="https://i.ytimg.com">
    <title>YouTube Link Generator</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --text: #ffffff;
            --text-dim: #aaaaaa;
            --yt-red: #FF0000;
            --accent-blue: #3ea6ff;
            --glass: rgba(255, 255, 255, 0.07);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #1e1e1e 0%, #0f0f0f 100%);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center; /* Desktop centering */
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px; /* Slightly wider for better desktop look */
            padding: 20px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 40px 28px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            width: 100%;
        }

        /* Mobile specific adjustments to make it "bigger" */
        @media (max-width: 480px) {
            body { align-items: flex-start; padding-top: 15vh; } /* Positions card better on tall screens */
            .container { padding: 16px; }
            .card { padding: 48px 24px; border-radius: 32px; }
            h1 { font-size: 1.8rem !important; }
            input { font-size: 1.1rem !important; padding: 18px !important; }
            .btn { padding: 18px !important; font-size: 1.1rem !important; }
        }

        .hidden { display: none !important; }

        h1 { font-size: 1.6rem; font-weight: 800; margin: 0 0 10px 0; letter-spacing: -0.5px; line-height: 1.2; }
        p.subtitle { color: var(--text-dim); font-size: 1rem; margin-bottom: 30px; }

        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; margin-bottom: 10px; margin-left: 5px; }
        
        input {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--yt-red);
            background: rgba(0,0,0,0.5);
            box-shadow: 0 0 0 4px rgba(255, 0, 0, 0.15);
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: transform 0.1s;
            text-decoration: none;
        }

        .btn-primary { background: var(--yt-red); color: white; margin-top: 10px; }
        .btn-primary:active { transform: scale(0.97); }

        .btn-outline { 
            background: white; 
            color: black; 
            margin-top: 15px;
            box-shadow: 0 8px 20px rgba(255,255,255,0.1);
        }

        .result-card {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            border: 1px dashed rgba(255,255,255,0.2);
        }

        .generated-url {
            display: block;
            color: var(--accent-blue);
            font-family: monospace;
            font-size: 0.95rem;
            margin: 12px 0;
            word-break: break-all;
        }

        /* Viewer specific */
        .thumb-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #222;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .thumbnail { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.4s ease; }

        .video-title { 
            font-size: 1.2rem; 
            font-weight: 700; 
            margin-bottom: 30px; 
            line-height: 1.4;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            color: #000;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="generator" class="card hidden">
            <h1>YouTube Link Generator</h1>
            <p class="subtitle">Optimized for Instagram Stories</p>
            
            <div class="input-group">
                <label>Paste YouTube Link</label>
                <input type="text" id="ytUrl" placeholder="youtube.com/watch?v=..." spellcheck="false" autocomplete="off">
            </div>

            <button class="btn btn-primary" onclick="generateLink()">Generate App Link</button>

            <div id="result" class="result-card hidden">
                <span style="font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700;">Ready to use:</span>
                <span id="newUrl" class="generated-url"></span>
                <button class="btn btn-outline" onclick="copyLink()">Copy URL</button>
            </div>
        </div>

        <div id="viewer" class="card hidden">
            <div class="thumb-wrapper">
                <img id="thumb" src="" alt="" class="thumbnail" style="opacity: 0;">
            </div>
            <div id="title" class="video-title">Loading...</div>
            <div id="btnContainer"></div>
        </div>
    </div>

    <div id="toast" class="toast">Copied to clipboard!</div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v');

        if (videoId) {
            setupViewer(videoId);
        } else {
            document.getElementById('generator').classList.remove('hidden');
        }

        function generateLink() {
            const input = document.getElementById('ytUrl').value;
            const idMatch = input.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/);
            
            if (idMatch) {
                const finalUrl = `${window.location.origin}${window.location.pathname}?v=${idMatch[1]}`;
                document.getElementById('result').classList.remove('hidden');
                document.getElementById('newUrl').innerText = finalUrl;
            } else {
                showToast("Invalid YouTube link");
            }
        }

        function copyLink() {
            const text = document.getElementById('newUrl').innerText;
            navigator.clipboard.writeText(text);
            showToast("Link Copied!");
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.opacity = "1";
            t.style.bottom = "40px";
            setTimeout(() => {
                t.style.opacity = "0";
                t.style.bottom = "30px";
            }, 2500);
        }

        async function setupViewer(id) {
            document.getElementById('viewer').classList.remove('hidden');
            const thumbImg = document.getElementById('thumb');
            
            thumbImg.src = `https://img.youtube.com/vi/${id}/mqdefault.jpg`;
            thumbImg.onload = () => thumbImg.style.opacity = "1";
            
            const maxRes = new Image();
            maxRes.src = `https://img.youtube.com/vi/${id}/maxresdefault.jpg`;
            maxRes.onload = () => { if(maxRes.width > 120) thumbImg.src = maxRes.src; };

            fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('title').innerText = data.title;
                    document.title = data.title;
                })
                .catch(() => document.getElementById('title').innerText = "Tap to Watch Video");

            const btnContainer = document.getElementById('btnContainer');
            const btn = document.createElement('a');
            btn.className = 'btn btn-outline';
            btn.style.marginTop = '0';
            btn.innerText = 'WATCH IN YOUTUBE APP';
            
            const isAndroid = /Android/i.test(navigator.userAgent);
            const isiOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

            if (isAndroid) {
                btn.href = `intent://www.youtube.com/watch?v=${id}#Intent;package=com.google.android.youtube;scheme=https;end`;
            } else if (isiOS) {
                btn.href = `youtube://www.youtube.com/watch?v=${id}`;
                btn.onclick = () => {
                    setTimeout(() => { window.location.href = `https://www.youtube.com/watch?v=${id}`; }, 500);
                };
            } else {
                btn.href = `https://www.youtube.com/watch?v=${id}`;
            }
            btnContainer.appendChild(btn);
        }
    </script>
</body>
</html>
