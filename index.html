<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Opening Video...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .box {
      max-width: 300px;
    }
    img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: red;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>

  <script>
    const params = new URLSearchParams(window.location.search);
    const videoId = params.get("v");

    if (videoId) {
      const youtubeUrl = "https://www.youtube.com/watch?v=" + videoId;
      const androidIntent = "intent://www.youtube.com/watch?v=" + videoId + "#Intent;package=com.google.android.youtube;scheme=https;end;";

      // Try Android deep link first
      window.location.href = androidIntent;

      // Fallback to normal YouTube link after short delay
      setTimeout(function() {
        window.location.href = youtubeUrl;
      }, 1500);

      // Add fallback button manually
      window.onload = function() {
        document.getElementById("openBtn").onclick = function() {
          window.location.href = youtubeUrl;
        };
        document.getElementById("thumbnail").src = "https://img.youtube.com/vi/" + videoId + "/hqdefault.jpg";
      };

    } else {
      document.body.innerHTML = "No video specified.";
    }
  </script>

</head>

<body>
  <div class="box">
    <img id="thumbnail" src="" alt="Video Thumbnail">
    <p>Opening in YouTube App...</p>
    <button id="openBtn">Tap if it doesn't open</button>
  </div>
</body>
</html>
