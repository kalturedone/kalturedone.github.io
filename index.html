<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>YouTube App Link Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .box {
      max-width: 400px;
      width: 90%;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
    }
    button {
      padding: 10px 15px;
      border-radius: 8px;
      border: none;
      background: red;
      color: white;
      cursor: pointer;
    }
    .result {
      margin-top: 15px;
      word-break: break-all;
    }
  </style>
</head>
<body>

<div class="box" id="generator">
  <h2>YouTube App Link Generator</h2>
  <input type="text" id="ytLink" placeholder="Paste YouTube link here">
  <button onclick="generateLink()">Generate Link</button>
  <div class="result" id="result"></div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const videoId = params.get("v");

  // If ?v= exists → redirect
  if (videoId) {
    const youtubeUrl = "https://www.youtube.com/watch?v=" + videoId;
    window.location.replace(youtubeUrl);
  }

  function generateLink() {
    const input = document.getElementById("ytLink").value;
    const match = input.match(/(?:v=|youtu\.be\/)([^&]+)/);

    if (!match) {
      document.getElementById("result").innerText = "Invalid YouTube link.";
      return;
    }

    const id = match[1];
    const base = window.location.origin + window.location.pathname;
    const finalLink = base + "?v=" + id;

    document.getElementById("result").innerHTML =
      "Copy this link for Instagram:<br><br>" + finalLink;
  }
</script>

</body>
</html>
