<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Watch on YouTube</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 420px;
      width: 90%;
    }

    img {
      width: 100%;
      border-radius: 14px;
      margin-bottom: 20px;
    }

    h2 {
      margin-bottom: 20px;
      font-weight: 600;
      font-size: 20px;
    }

    .button {
      display: inline-block;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      background: #ff0000;
      color: white;
      text-decoration: none;
      margin-bottom: 15px;
    }

    .small-text {
      font-size: 13px;
      color: #bbb;
      line-height: 1.5;
      margin-top: 10px;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #ff0000;
      color: white;
      cursor: pointer;
    }

    #result {
      margin-top: 15px;
      font-size: 14px;
      word-break: break-all;
    }
  </style>
</head>

<body>

<div class="container" id="content"></div>

<script>
  const params = new URLSearchParams(window.location.search);
  const videoId = params.get("v");
  const container = document.getElementById("content");

  if (videoId) {
    const youtubeUrl = "https://www.youtube.com/watch?v=" + videoId;
    const thumbnail = "https://img.youtube.com/vi/" + videoId + "/hqdefault.jpg";

    container.innerHTML = `
      <img src="${thumbnail}" alt="Video Thumbnail">
      <h2>Watch This Video</h2>
      <a class="button" href="${youtubeUrl}">Watch in YouTube App</a>
      <div class="small-text">
        If you're inside Instagram, tap ⋯ in the top corner<br>
        then select <b>Open in Browser</b> for best experience.
      </div>
    `;
  } else {
    container.innerHTML = `
      <h2>YouTube App Link Generator</h2>
      <input id="ytLink" type="text" placeholder="Paste YouTube link here">
      <button onclick="generateLink()">Generate Link</button>
      <div id="result"></div>
    `;
  }

  function generateLink() {
    const input = document.getElementById("ytLink").value;
    const match = input.match(/(?:v=|youtu\\.be\\/)([^&]+)/);

    if (!match) {
      document.getElementById("result").innerText = "Invalid YouTube link.";
      return;
    }

    const id = match[1];
    const base = window.location.origin + window.location.pathname;
    const finalLink = base + "?v=" + id;

    document.getElementById("result").innerHTML =
      "Copy this link for Instagram:<br><br>" + finalLink;
  }
</script>

</body>
</html>
