<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://img.youtube.com">
    <link rel="preconnect" href="https://i.ytimg.com">
    <title>YouTube Link Generator</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --surface-hover: #252525;
            --text: #ffffff;
            --text-dim: #aaaaaa;
            --yt-red: #FF0000;
            --accent-blue: #3ea6ff;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #1a1a1a 0%, #0f0f0f 100%);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .hidden { display: none !important; }

        /* Typography */
        h1 { font-size: 1.6rem; font-weight: 800; margin: 0 0 8px 0; letter-spacing: -0.5px; }
        p.subtitle { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 24px; }

        /* Input Styling */
        .input-group { margin-bottom: 16px; text-align: left; }
        label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; margin-left: 4px; }
        
        input {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2);
            color: white;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--yt-red);
            background: rgba(0,0,0,0.4);
            box-shadow: 0 0 0 4px rgba(255, 0, 0, 0.1);
        }

        /* Buttons */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: transform 0.1s active, opacity 0.2s;
            text-decoration: none;
        }

        .btn-primary { background: var(--yt-red); color: white; }
        .btn-primary:active { transform: scale(0.98); background: #cc0000; }

        .btn-outline { 
            background: white; 
            color: black; 
            margin-top: 12px;
            box-shadow: 0 4px 12px rgba(255,255,255,0.1);
        }

        /* Result Area */
        .result-card {
            margin-top: 24px;
            padding: 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            border: 1px dashed rgba(255,255,255,0.2);
        }

        .generated-url {
            display: block;
            color: var(--accent-blue);
            font-family: monospace;
            font-size: 0.9rem;
            margin: 8px 0;
            word-break: break-all;
        }

        /* Viewer specific */
        .thumb-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #222;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .thumbnail { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.4s ease; }

        .video-title { 
            font-size: 1.1rem; 
            font-weight: 600; 
            margin-bottom: 24px; 
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="generator" class="card hidden">
            <h1>YouTube Link Generator</h1>
            <p class="subtitle">Create Instagram-friendly app links</p>
            
            <div class="input-group">
                <label>Paste Video Link</label>
                <input type="text" id="ytUrl" placeholder="youtube.com/watch?v=..." spellcheck="false">
            </div>

            <button class="btn btn-primary" onclick="generateLink()">Generate App Link</button>

            <div id="result" class="result-card hidden">
                <span style="font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase;">Your Ready Link:</span>
                <span id="newUrl" class="generated-url"></span>
                <button class="btn btn-outline" style="padding: 10px; font-size: 0.85rem;" onclick="copyLink()">Copy Link</button>
            </div>
        </div>

        <div id="viewer" class="card hidden">
            <div class="thumb-wrapper">
                <img id="thumb" src="" alt="" class="thumbnail" style="opacity: 0;">
            </div>
            <div id="title" class="video-title">Loading video details...</div>
            <div id="btnContainer"></div>
        </div>
    </div>

    <div id="toast" class="toast">Copied to clipboard!</div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v');

        if (videoId) {
            setupViewer(videoId);
        } else {
            document.getElementById('generator').classList.remove('hidden');
        }

        function generateLink() {
            const input = document.getElementById('ytUrl').value;
            const idMatch = input.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/);
            
            if (idMatch) {
                const finalUrl = `${window.location.origin}${window.location.pathname}?v=${idMatch[1]}`;
                document.getElementById('result').classList.remove('hidden');
                document.getElementById('newUrl').innerText = finalUrl;
            } else {
                showToast("Please enter a valid YouTube link");
            }
        }

        function copyLink() {
            const text = document.getElementById('newUrl').innerText;
            navigator.clipboard.writeText(text);
            showToast("Copied to clipboard!");
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.opacity = "1";
            setTimeout(() => t.style.opacity = "0", 2000);
        }

        async function setupViewer(id) {
            document.getElementById('viewer').classList.remove('hidden');
            const thumbImg = document.getElementById('thumb');
            
            // Fast/High Res Load
            thumbImg.src = `https://img.youtube.com/vi/${id}/mqdefault.jpg`;
            thumbImg.onload = () => thumbImg.style.opacity = "1";
            
            const maxRes = new Image();
            maxRes.src = `https://img.youtube.com/vi/${id}/maxresdefault.jpg`;
            maxRes.onload = () => { if(maxRes.width > 120) thumbImg.src = maxRes.src; };

            // Title
            fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('title').innerText = data.title;
                    document.title = data.title;
                })
                .catch(() => document.getElementById('title').innerText = "Tap to Watch Video");

            // Button
            const btnContainer = document.getElementById('btnContainer');
            const btn = document.createElement('a');
            btn.className = 'btn btn-outline';
            btn.style.marginTop = '0';
            btn.innerText = 'WATCH IN YOUTUBE APP';
            
            const isAndroid = /Android/i.test(navigator.userAgent);
            const isiOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

            if (isAndroid) {
                btn.href = `intent://www.youtube.com/watch?v=${id}#Intent;package=com.google.android.youtube;scheme=https;end`;
            } else if (isiOS) {
                btn.href = `youtube://www.youtube.com/watch?v=${id}`;
                btn.onclick = () => {
                    setTimeout(() => { window.location.href = `https://www.youtube.com/watch?v=${id}`; }, 500);
                };
            } else {
                btn.href = `https://www.youtube.com/watch?v=${id}`;
            }
            btnContainer.appendChild(btn);
        }
    </script>
</body>
</html>
