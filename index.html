<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SB2MRK90T1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-SB2MRK90T1');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://img.youtube.com">
    <title>YouTube Link Generator</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --text: #ffffff;
            --text-dim: #aaaaaa;
            --yt-red: #FF0000;
            --accent-blue: #3ea6ff;
            --glass: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: radial-gradient(circle at top, #1e1e1e 0%, #0f0f0f 100%);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 32px;
            padding: 40px 24px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            width: 100%;
        }

        /* Mobile Scale-Up */
        @media (max-width: 480px) {
            .container { justify-content: flex-start; padding-top: 10vh; }
            h1 { font-size: 2rem !important; }
            .btn { padding: 20px !important; font-size: 1.2rem !important; }
            input { font-size: 1.1rem !important; padding: 18px !important; }
        }

        .hidden { display: none !important; }
        h1 { font-size: 1.7rem; font-weight: 800; margin: 0 0 10px 0; letter-spacing: -0.8px; }
        p.subtitle { color: var(--text-dim); font-size: 1rem; margin-bottom: 30px; }

        input {
            width: 100%; padding: 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.4); color: white; font-size: 1rem; margin-bottom: 20px;
        }

        .btn {
            display: flex; align-items: center; justify-content: center; width: 100%;
            padding: 16px; border-radius: 18px; font-weight: 800; border: none; cursor: pointer;
            transition: transform 0.1s; text-decoration: none;
        }

        .btn-primary { background: var(--yt-red); color: white; }
        .btn-primary:active { transform: scale(0.96); }

        .btn-outline { background: white; color: black; box-shadow: 0 10px 25px rgba(255,255,255,0.1); }

        .result-card {
            margin-top: 30px; padding: 20px; background: rgba(0,0,0,0.2);
            border-radius: 20px; border: 1px dashed rgba(255,255,255,0.3);
        }

        .generated-url { display: block; color: var(--accent-blue); font-family: monospace; margin: 12px 0; word-break: break-all; }

        .thumb-wrapper { width: 100%; aspect-ratio: 16/9; background: #222; border-radius: 20px; overflow: hidden; margin-bottom: 25px; }
        .thumbnail { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.5s; }
        .video-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 30px; line-height: 1.4; }

        .toast {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: white; color: black; padding: 12px 28px; border-radius: 50px;
            font-weight: 700; opacity: 0; transition: all 0.3s; z-index: 999;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="generator" class="card hidden">
            <h1>YouTube Link Generator</h1>
            <p class="subtitle">Get more views from Instagram</p>
            <input type="text" id="ytUrl" placeholder="Paste YouTube link here..." autocomplete="off">
            <button class="btn btn-primary" onclick="generateLink()">Generate Link</button>

            <div id="result" class="result-card hidden">
                <span style="font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase;">Your Link:</span>
                <span id="newUrl" class="generated-url"></span>
                <button class="btn btn-outline" onclick="copyLink()">Copy URL</button>
            </div>
        </div>

        <div id="viewer" class="card hidden">
            <div class="thumb-wrapper">
                <img id="thumb" src="" class="thumbnail" style="opacity: 0;">
            </div>
            <div id="title" class="video-title">Loading...</div>
            <div id="btnContainer"></div>
        </div>
    </div>

    <div id="toast" class="toast">Copied!</div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const vId = urlParams.get('v');

        if (vId) {
            setupViewer(vId);
        } else {
            document.getElementById('generator').classList.remove('hidden');
        }

        function generateLink() {
            const input = document.getElementById('ytUrl').value;
            const match = input.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/);
            if (match) {
                const finalUrl = `${window.location.origin}${window.location.pathname}?v=${match[1]}`;
                document.getElementById('result').classList.remove('hidden');
                document.getElementById('newUrl').innerText = finalUrl;
                
                // Track generation event
                gtag('event', 'generate_link', { 'video_id': match[1] });
            }
        }

        function copyLink() {
            navigator.clipboard.writeText(document.getElementById('newUrl').innerText);
            const t = document.getElementById('toast');
            t.style.opacity = "1";
            setTimeout(() => t.style.opacity = "0", 2000);
        }

        async function setupViewer(id) {
            document.getElementById('viewer').classList.remove('hidden');
            const thumb = document.getElementById('thumb');
            
            // Image Loading
            thumb.src = `https://img.youtube.com/vi/${id}/mqdefault.jpg`;
            thumb.onload = () => thumb.style.opacity = "1";
            const max = new Image();
            max.src = `https://img.youtube.com/vi/${id}/maxresdefault.jpg`;
            maxRes.onload = () => { if(max.width > 120) thumb.src = max.src; };

            // Get Metadata
            fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`)
                .then(r => r.json())
                .then(d => { 
                    document.getElementById('title').innerText = d.title;
                    // Track Page View with Title
                    gtag('event', 'view_video_page', { 'video_title': d.title, 'video_id': id });
                });

            // Button & Deep Linking
            const btn = document.createElement('a');
            btn.className = 'btn btn-outline';
            btn.innerText = 'WATCH IN YOUTUBE APP';
            
            const isAndroid = /Android/i.test(navigator.userAgent);
            const isiOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

            if (isAndroid) {
                btn.href = `intent://www.youtube.com/watch?v=${id}#Intent;package=com.google.android.youtube;scheme=https;end`;
            } else if (isiOS) {
                btn.href = `youtube://www.youtube.com/watch?v=${id}`;
                btn.onclick = () => { setTimeout(() => { window.location.href = `https://www.youtube.com/watch?v=${id}`; }, 500); };
            } else {
                btn.href = `https://www.youtube.com/watch?v=${id}`;
            }

            // TRACKING THE BUTTON CLICK
            btn.addEventListener('click', () => {
                gtag('event', 'click_watch_button', {
                    'video_id': id,
                    'device': isAndroid ? 'Android' : isiOS ? 'iOS' : 'Desktop'
                });
            });

            document.getElementById('btnContainer').appendChild(btn);
        }
    </script>
</body>
</html>
